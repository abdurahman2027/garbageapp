{% extends 'base.html' %}

{% block content %}

<div class="result-container">

    <div class="result-window">

        <h1>Prediction Result!</h1>

        <div class="uploaded-image">
            <img src="{{ url_for('static', filename=image_path) }}" alt="Uploaded Image">
        </div>

        <div class="prediction-result">
            <h2>
                <i class="fa-solid fa-recycle"></i>
                Predicted Class: {{ prediction }}
            </h2>

            <h3>
                <i class="fa-solid fa-chart-line"></i>
                Confidence: {{ confidence }}%
            </h3>
        </div>

        <!-- Eco Suggestion Popup -->
<div id="ecoPopup" class="popup">

    <div class="popup-content">

        <span class="close-btn">&times;</span>

        <h2>
            <i class="fa-solid fa-leaf"></i>
            Eco Suggestion
        </h2>

        <p>{{ eco_tip }}</p>
        <div class="resource-link">

    <p>
        If you want to know more about managing this type of waste responsibly,
        please visit:
    </p>

    <a href="{{ resource_link }}" target="_blank">
        Learn More Here
    </a>

</div>

    </div>

</div>
        <a href="/">
            <button>Upload Another Image</button>
        </a>

    </div>

</div>
<script>

window.onload = function() {

    setTimeout(function() {

        document.getElementById("ecoPopup").style.display = "flex";

    }, 2500);   // 2500 milliseconds = 2.5 seconds

}

document.querySelector(".close-btn").onclick = function() {
    document.getElementById("ecoPopup").style.display = "none";
}

window.onclick = function(event) {
    const popup = document.getElementById("ecoPopup");

    if (event.target == popup) {
        popup.style.display = "none";
    }
}

</script>

{% endblock %}
